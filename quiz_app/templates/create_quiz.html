{% extends 'base.html' %}

{% block title %}Create Quiz - Quiz App{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                Create New Quiz
            </div>
            
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="form-group">
                        <label for="id_title">Quiz Title</label>
                        <input 
                            type="text" 
                            class="form-control {% if form.title.errors %}is-invalid{% endif %}" 
                            id="id_title" 
                            name="title" 
                            placeholder="Enter quiz title"
                            value="{{ form.title.value|default:'' }}"
                            required
                        >
                        {% if form.title.errors %}
                            <div class="invalid-feedback">
                                {{ form.title.errors.0 }}
                            </div>
                        {% endif %}
                    </div>
                    
                    <div class="form-group">
                        <label for="id_description">Description</label>
                        <textarea 
                            class="form-control {% if form.description.errors %}is-invalid{% endif %}" 
                            id="id_description" 
                            name="description" 
                            placeholder="Enter quiz description"
                            rows="4"
                        >{{ form.description.value|default:'' }}</textarea>
                        {% if form.description.errors %}
                            <div class="invalid-feedback">
                                {{ form.description.errors.0 }}
                            </div>
                        {% endif %}
                    </div>
                    
                    <div class="form-group">
                        <div class="form-check">
                            <input 
                                type="checkbox" 
                                class="form-check-input" 
                                id="id_is_active" 
                                name="is_active"
                                {% if not form.is_bound or form.is_active.value %}checked{% endif %}
                            >
                            <label class="form-check-label" for="id_is_active">
                                Active (Students can take this quiz)
                            </label>
                        </div>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">
                            Create Quiz
                        </button>
                        <a href="{% url 'teacher_dashboard' %}" class="btn btn-secondary">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
